name: Bug report
description: Something in spacemap doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan /some/folder
        2. Open the table and press …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: spacemap version
      description: The output of `spacemap --version`.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed it
      placeholder: AppImage, built from source, …
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: Fedora 44, KDE Plasma (Wayland)
  - type: input
    id: filesystem
    attributes:
      label: Filesystem scanned
      description: For wrong sizes or scan problems, the filesystem type (ext4, btrfs, NTFS, a network share…).
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, terminal output, or anything that helps. Please leave out private file names you don't want public.
