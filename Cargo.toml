[package]
name = "spacescan"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Disk-usage explorer for Linux: sunburst chart, keyboard-driven table, and text/CSV/JSON reports"
repository = "https://github.com/a-kurczyn/spacescan"
readme = "README.md"
keywords = ["disk-usage", "du", "sunburst", "storage", "ncdu"]
categories = ["command-line-utilities", "filesystem", "visualization"]
rust-version = "1.95"

[dependencies]
x11rb = "0.13"
chrono = "0.4.45"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false }
infer = "0.22.0"
libc = "0.2.189"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stacker = "0.1.25"
trash = "5.2.6"
unicode-normalization = "0.1.25"
uzers = "0.12.2"
wl-clipboard-rs = "0.9"

# Optimized across the whole program: smaller and faster (slower to build).
[profile.release]
lto = "fat"
codegen-units = 1

# Like release, but quick to build (no link-time optimization), for test
# runs during development: `cargo test --profile quick`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
